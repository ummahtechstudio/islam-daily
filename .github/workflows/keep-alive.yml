name: Supabase keep-alive

# Free-tier Supabase pauses after 7 days of inactivity. A daily POST to the
# keep_alive table keeps the project awake with a safe buffer — even if a few
# runs are skipped (free-tier GitHub Actions can drop jobs during platform
# incidents), the window never approaches 7 days.

on:
  schedule:
    # Daily at 12:00 UTC. GitHub typically delivers cron within 5-15 minutes
    # of the target. Off-peak time so we don't queue behind everyone else's
    # midnight-UTC jobs.
    - cron: '0 12 * * *'
  # Allow manual triggering from the Actions tab for testing.
  workflow_dispatch:

# Only one keep-alive can run at a time — if a previous run is still going
# (unlikely but possible during platform slowness), let it finish rather
# than racing with it.
concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Insert + prune
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify secrets are configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not set on this repository."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set on this repository."
            exit 1
          fi

      - name: Insert keep-alive row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Capture both body and status code from a single curl call.
          response=$(curl --silent --show-error \
            --max-time 30 \
            --write-out '\n%{http_code}' \
            --request POST "${SUPABASE_URL}/rest/v1/keep_alive" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data '{}')
          status=$(printf '%s\n' "$response" | tail -n1)
          body=$(printf '%s\n' "$response" | sed '$d')
          echo "HTTP ${status}"
          if [ -n "$body" ]; then
            echo "Body: ${body}"
          fi
          # Required by the spec: insert failure must fail the job so a
          # broken keep-alive is visible in the Actions tab.
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Supabase keep-alive insert failed with HTTP ${status}"
            exit 1
          fi
          echo "::notice::Supabase pinged successfully (HTTP ${status})"

      - name: Prune rows older than 7 days
        # Independent from the insert: even if cleanup fails for some reason,
        # the insert above already kept the project awake. We log a warning
        # but don't fail the job.
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          # PostgREST filter syntax: created_at=lt.<iso-timestamp>.
          # The DELETE policy on the table additionally enforces the 7-day
          # cutoff server-side, so this filter is belt-and-braces.
          cutoff=$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          response=$(curl --silent --show-error \
            --max-time 30 \
            --write-out '\n%{http_code}' \
            --request DELETE "${SUPABASE_URL}/rest/v1/keep_alive?created_at=lt.${cutoff}" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Prefer: return=minimal")
          status=$(printf '%s\n' "$response" | tail -n1)
          echo "Cleanup HTTP ${status} (cutoff ${cutoff})"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::warning::Cleanup returned HTTP ${status} — keep-alive insert already succeeded so the project is awake."
          fi
