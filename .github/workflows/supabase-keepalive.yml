name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to reset the inactivity timer
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://vchfykblowmrcvyaljxn.supabase.co/rest/v1/names_of_allah?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Keep-alive failed — got $CODE instead of 200."
            exit 1
          fi
          echo "Keep-alive OK."
