name: Supabase Keep-Alive

# NOTE: GitHub only fires `schedule` triggers from the DEFAULT branch (main).
# In a public repo GitHub also auto-disables scheduled workflows after 60 days
# without repository activity. The "Keep this workflow enabled" step below
# resets that timer on every run so this can never silently stop again.

on:
  schedule:
    # Every 6 hours (minute 17 avoids GitHub's top-of-hour backlog). Supabase now
    # pauses free projects that lack "sufficient user database activity" over a
    # week; one ping a day triggered a pause warning in Oct 2026, so we now make
    # several real reads, four times a day.
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # lets GITHUB_TOKEN call the "enable workflow" endpoint
    steps:
      - name: Query Supabase to reset the inactivity timer
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Real reads on tables the app itself uses, so the activity looks like
          # genuine database use. `|| RC=$?` keeps `bash -e` from aborting before
          # we can print a useful message on a transport-level curl failure.
          BASE="https://vchfykblowmrcvyaljxn.supabase.co/rest/v1"
          FAILED=0
          for TABLE in names_of_allah duas quran_ayahs; do
            RC=0
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 --retry 3 --retry-delay 15 --retry-all-errors \
              "$BASE/$TABLE?select=*&limit=5" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || RC=$?
            if [ "$RC" -ne 0 ]; then
              echo "::error::$TABLE: curl exited $RC (6 = DNS failure, 7 = connection refused, 28 = timeout; last HTTP status: ${CODE:-none}). Is the Supabase project paused or restoring?"
              FAILED=1
            elif [ "$CODE" != "200" ]; then
              echo "::error::$TABLE: got HTTP $CODE instead of 200."
              FAILED=1
            else
              echo "$TABLE: HTTP 200"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
          echo "Keep-alive OK."

      # Runs even if the Supabase ping failed, so an outage on their side
      # can't also let GitHub's 60-day inactivity rule disable this workflow.
      - name: Keep this workflow enabled (reset GitHub's 60-day inactivity timer)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # github.workflow_ref looks like "owner/repo/.github/workflows/<file>.yml@refs/heads/main"
          WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          echo "Re-enabling ${WORKFLOW_FILE} on ${GITHUB_REPOSITORY}"
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/enable"
          echo "Workflow enabled."
