name: Supabase Keep-Alive

# NOTE: GitHub only fires `schedule` triggers from the DEFAULT branch (main).
# In a public repo GitHub also auto-disables scheduled workflows after 60 days
# without repository activity. The "Keep this workflow enabled" step below
# resets that timer on every run so this can never silently stop again.

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # lets GITHUB_TOKEN call the "enable workflow" endpoint
    steps:
      - name: Query Supabase to reset the inactivity timer
        run: |
          # `|| RC=$?` keeps `bash -e` from aborting before we can print a
          # useful message when curl fails at the transport level (DNS, TLS…).
          RC=0
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 15 --retry-all-errors \
            "https://vchfykblowmrcvyaljxn.supabase.co/rest/v1/names_of_allah?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}") || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::curl exited $RC (6 = DNS failure, 7 = connection refused, 28 = timeout; last HTTP status seen: ${CODE:-none}). Is the Supabase project paused or still restoring?"
            exit 1
          fi
          echo "HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Keep-alive failed — got $CODE instead of 200."
            exit 1
          fi
          echo "Keep-alive OK."

      # Runs even if the Supabase ping failed, so an outage on their side
      # can't also let GitHub's 60-day inactivity rule disable this workflow.
      - name: Keep this workflow enabled (reset GitHub's 60-day inactivity timer)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # github.workflow_ref looks like "owner/repo/.github/workflows/<file>.yml@refs/heads/main"
          WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          echo "Re-enabling ${WORKFLOW_FILE} on ${GITHUB_REPOSITORY}"
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/enable"
          echo "Workflow enabled."
